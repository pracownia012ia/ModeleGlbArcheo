<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Zabytków 3D</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #18181b; color: #f4f4f5; overflow: hidden;
    }

    .layout { display: flex; width: 100%; height: 100%; }

    .viewer-section {
      flex: 1; position: relative; height: 100%;
      background: radial-gradient(circle, #27272a 0%, #18181b 100%);
    }

    model-viewer { width: 100%; height: 100%; --poster-color: transparent; }

    /* Nakładka plakatu i przycisku kontrolowana w 100% przez nasz kod */
    #poster-overlay {
      position: absolute; inset: 0;
      background-size: contain; background-repeat: no-repeat; background-position: center;
      background-color: rgba(24, 24, 27, 0.65);
      z-index: 15; pointer-events: none;
    }
    #button-load {
      background-color: rgba(24, 24, 27, 0.92); color: #fff; cursor: pointer;
      border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px 22px; font-weight: 600; font-size: 14px;
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 20; transition: all 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      text-align: center;
    }
    #button-load:hover { background-color: #b45309; border-color: #fff; }

    /* Prawy panel boczny */
    .sidebar {
      width: 380px; height: 100%; background-color: #202024;
      border-left: 1px solid #3f3f46; display: flex; flex-direction: column;
    }
    .selector-header {
      padding: 14px 16px; border-bottom: 1px solid #3f3f46; background-color: #1c1c1f;
    }
    .selector-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
      color: #a1a1aa; margin-bottom: 8px; font-weight: 600;
    }
    .artifact-list {
      display: flex; flex-wrap: wrap; gap: 6px; max-height: 125px; overflow-y: auto;
    }
    .artifact-btn {
      background-color: #27272a; color: #e4e4e7; border: 1px solid #3f3f46;
      padding: 6px 11px; border-radius: 6px; font-size: 12px; cursor: pointer;
      transition: all 0.15s; text-align: left;
    }
    .artifact-btn:hover { background-color: #3f3f46; }
    .artifact-btn.active {
      background-color: #b45309; color: #fff; border-color: #d97706; font-weight: 600;
    }

    .info-panel { padding: 18px 16px; overflow-y: auto; flex: 1; }
    .artifact-main-title {
      margin: 0 0 16px 0; font-size: 18px; color: #ffffff;
      border-bottom: 1px solid #3f3f46; padding-bottom: 10px;
    }
    .meta-item { margin-bottom: 14px; }
    .meta-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
      color: #fbbf24; font-weight: 600; margin-bottom: 3px;
    }
    .meta-value { font-size: 13.5px; line-height: 1.45; color: #e4e4e7; margin: 0; }

    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .viewer-section { height: 52%; }
      .sidebar { width: 100%; height: 48%; border-left: none; border-top: 1px solid #3f3f46; }
    }
  </style>
</head>
<body>

  <div class="layout">
    <div class="viewer-section">
      <!-- Własna warstwa plakatu i przycisku - niezależna od błędów wewnętrznych model-viewer -->
      <div id="poster-overlay"></div>
      <button id="button-load" type="button">Załaduj model 3D</button>

      <!-- Usunięto problematyczne reveal="manual" - model nie ładuje się, bo nie ma przypisanego src na starcie -->
      <model-viewer 
        id="viewer" 
        exposure="1" 
        camera-controls 
        touch-action="pan-y" 
        auto-rotate 
        tone-mapping="aces" 
        shadow-intensity="1" 
        alt="Model 3D zabytku">
      </model-viewer>
    </div>

    <div class="sidebar">
      <div class="selector-header">
        <div class="selector-title" id="liczba-zabytkow">Wybierz zabytek z okresu:</div>
        <div class="artifact-list" id="artifact-buttons"></div>
      </div>

      <div class="info-panel">
        <h2 class="artifact-main-title" id="info-tytul">Nazwa zabytku</h2>
        
        <div class="meta-item">
          <div class="meta-label">Stanowisko</div>
          <p class="meta-value" id="info-stanowisko">—</p>
        </div>

        <div class="meta-item">
          <div class="meta-label">Opis zabytku / Datowanie / Kultura</div>
          <p class="meta-value" id="info-opis">—</p>
        </div>

        <div class="meta-item">
          <div class="meta-label">Rok i autor badań</div>
          <p class="meta-value" id="info-badania">—</p>
        </div>

        <div class="meta-item">
          <div class="meta-label">Miejsce przechowywania</div>
          <p class="meta-value" id="info-miejsce">—</p>
        </div>

        <div class="meta-item" id="sekcja-literatura">
          <div class="meta-label">Literatura</div>
          <p class="meta-value" id="info-literatura">—</p>
        </div>
      </div>
    </div>
  </div>

  <script>

    // 1. Ścieżka do folderu z modelami:
    const BAZA_URL = "https://pub-455c0d32f5c8404082c43a9158408b16.r2.dev";

    // 2. Baza zabytków podzielona na okresy:
    const BAZA_OKRESOW = {
      "wczesne_zelazo": [
        {
          tytul: "Naczynie pomorskie",
          plik: "NaczyniePomorskieBlend2ShaderrMiarka2.glb",
          poster: "MuzeumNaczyniePomorskiePrev.png",
          stanowisko: "Żuków, stan. 1,gm.…woj. lubelskie",
          opis: "Naczynie rytualne, tzw. kernos z wczesnej epoki żelaza (600-500 BC, kultura pomorska)",
          badania: "Badania wykopaliskowe w 1960 r. (J. Gurba)",
          miejsce: "Zbiory Muzeum Narodowego w Lublinie",
          literatura: "Czopek 1992, tabl. XLI; Kuśnierz 2010, ryc. 2: 1"
        },
        {
          tytul: "Kubek z ornamentem",
          plik: "EKInkrustowanyKubekGLBVer2.glb",
          poster: "EKInkrustowanyKubekPrev.png",
          stanowisko: "Jakubowice Murowane, stan. 5, gmwoj. lubelskie",
          opis: "Kubek z ornamentem wypełnionym białą inkrustacją z wczesnej epoki żelaza (…BC, kultura łużycka)",
          badania: "Badania wykopaliskowe w … r. (U. Kurzątkowska, TYLKO?)",
          miejsce: "Zbiory IA UMCS",
          literatura: ""
        }
      ],
      "rzym": [
        {
          tytul: "Zapinka Kaczkowata",
          plik: "MZFibulaKaczk.glb",
          poster: "56. zapinka kaczka.png",
          stanowisko: "Masłomęcz, stan.…,gm. Hrubieszów, ",
          opis: "Brązowa zapinka w kształcie kaczki AVII typu Masłomęcz z okresu rzymskiego (koniec II – początek III w. po Chr., kultura wielbarska)",
          badania: "Badania wykopaliskowe w … r. (A. Kokowski)",
          miejsce: "Zbiory Muzeum Zamojskiego w Zamościu",
          literatura: ""
        }
      ]
    };

    const params = new URLSearchParams(window.location.search);
    const wybranyOkres = params.get('okres') || "wczesne_zelazo";
    const listaZabytkow = BAZA_OKRESOW[wybranyOkres] || [];

    const viewer = document.getElementById('viewer');
    const loadButton = document.getElementById('button-load');
    const posterOverlay = document.getElementById('poster-overlay');
    const buttonsContainer = document.getElementById('artifact-buttons');
    
    let aktualnyZabytek = null;
    let czyOdblokowanoOkno = false;

    function rozpocznijPobieranieModelu() {
      if (!aktualnyZabytek) return;
      czyOdblokowanoOkno = true;
      const docelowyUrl = `${BAZA_URL}/Modele/${aktualnyZabytek.plik}`;

      // Jeśli ten sam model jest już załadowany na ekranie, po prostu schowaj przycisk
      if (viewer.getAttribute('src') === docelowyUrl && viewer.loaded) {
        loadButton.style.display = "none";
        posterOverlay.style.display = "none";
        return;
      }

      loadButton.style.display = "block";
      loadButton.style.backgroundColor = "rgba(24, 24, 27, 0.92)";
      loadButton.textContent = "Trwa pobieranie modelu... 0%";
      
      // Przypisanie atrybutu src w tym miejscu fizycznie rozpoczyna pobieranie pliku .glb
      viewer.setAttribute('src', docelowyUrl);
    }

    function wybierzZabytek(index, czyKliknietoZListy = false) {
      const zabytek = listaZabytkow[index];
      if (!zabytek) return;
      aktualnyZabytek = zabytek;

      document.querySelectorAll('.artifact-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });

      document.getElementById('info-tytul').textContent = zabytek.tytul;
      document.getElementById('info-stanowisko').textContent = zabytek.stanowisko || "Brak danych";
      document.getElementById('info-opis').textContent = zabytek.opis || "Brak danych";
      document.getElementById('info-badania').textContent = zabytek.badania || "Brak danych";
      document.getElementById('info-miejsce').textContent = zabytek.miejsce || "Brak danych";

      const sekcjaLit = document.getElementById('sekcja-literatura');
      if (zabytek.literatura && zabytek.literatura.trim() !== "") {
        sekcjaLit.style.display = "block";
        document.getElementById('info-literatura').textContent = zabytek.literatura;
      } else {
        sekcjaLit.style.display = "none";
      }

      if (zabytek.poster) {
        posterOverlay.style.backgroundImage = `url('${BAZA_URL}/Postery/${zabytek.poster}')`;
      } else {
        posterOverlay.style.backgroundImage = "none";
      }

      // Na starcie strony czekamy na kliknięcie (oszczędność transferu)
      if (!czyOdblokowanoOkno && !czyKliknietoZListy) {
        posterOverlay.style.display = "block";
        loadButton.style.display = "block";
        loadButton.style.backgroundColor = "rgba(24, 24, 27, 0.92)";
        loadButton.textContent = `Załaduj model 3D: ${zabytek.tytul}`;
      } else {
        // Przy kliknięciu w przycisk z listy od razu pobieramy wybrany model
        rozpocznijPobieranieModelu();
      }
    }

    // Kliknięcie środkowego przycisku "Załaduj model 3D"
    loadButton.addEventListener('click', () => {
      rozpocznijPobieranieModelu();
    });

    // Aktualizacja procentów i ukrywanie napisu po pobraniu
    viewer.addEventListener('progress', (event) => {
      const procent = Math.round(event.detail.totalProgress * 100);
      loadButton.textContent = `Trwa pobieranie modelu... ${procent}%`;
      if (procent >= 100) {
        setTimeout(() => {
          loadButton.style.display = "none";
          posterOverlay.style.display = "none";
        }, 150);
      }
    });

    // Główne zdarzenie zakończenia wczytywania sceny 3D
    viewer.addEventListener('load', () => {
      loadButton.style.display = "none";
      posterOverlay.style.display = "none";
    });

    // Obsługa błędu (np. literówka w nazwie pliku .glb)
    viewer.addEventListener('error', () => {
      loadButton.style.display = "block";
      loadButton.style.backgroundColor = "#8b0000";
      loadButton.textContent = `Błąd 404: Nie znaleziono pliku ${BAZA_URL}/${aktualnyZabytek ? aktualnyZabytek.plik : ''}`;
    });

    // Inicjalizacja listy przycisków na starcie
    if (listaZabytkow.length > 0) {
      document.getElementById('liczba-zabytkow').textContent = `Zabytki w tym okresie (${listaZabytkow.length}):`;
      listaZabytkow.forEach((zabytek, index) => {
        const btn = document.createElement('button');
        btn.className = 'artifact-btn';
        btn.textContent = `${index + 1}. ${zabytek.tytul}`;
        btn.onclick = () => wybierzZabytek(index, true);
        buttonsContainer.appendChild(btn);
      });
      wybierzZabytek(0, false);
    } else {
      document.getElementById('info-tytul').textContent = "Nie znaleziono okresu w bazie";
      loadButton.textContent = `Brak zdefiniowanego okresu: ?okres=${wybranyOkres}`;
    }
  </script>

</body>
</html>
